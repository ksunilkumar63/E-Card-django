{% extends 'cards/base.html' %}

{% block title %}Sign Up | E-Card{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-card">

        <h1>Create Account 🎉</h1>

        <p>Create your account to manage your E-Cards.</p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</section>

{% endblock %}
