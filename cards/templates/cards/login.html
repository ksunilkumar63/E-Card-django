{% extends 'cards/base.html' %}

{% block title %}Login | E-Card{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-card">

        <h1>Welcome Back 👋</h1>

        <p>Login to manage your E-Cards.</p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{% url 'signup' %}">
                Create Account
            </a>
        </p>

    </div>

</section>

{% endblock %}
