{% extends 'cards/base.html' %}

{% block title %}
{{ card.title }}
{% endblock %}

{% block content %}

<section class="detail-section">

    <div class="detail-card">


        <div class="detail-image">

            {% if card.image %}

            <img
                src="{{ card.image.url }}"
                alt="{{ card.title }}">

            {% else %}

            <div class="big-icon">
                💌
            </div>

            {% endif %}

        </div>


        <div class="detail-content">

            <span class="category">
                {{ card.category }}
            </span>

            <h1>
                {{ card.title }}
            </h1>

            <p>
                {{ card.description }}
            </p>

            <h2>
                ₹{{ card.price }}
            </h2>


            <div class="actions">

                <a
                    href="{% url 'card_update' card.pk %}"
                    class="btn edit-btn">

                    Edit Card

                </a>


                <a
                    href="{% url 'card_delete' card.pk %}"
                    class="btn delete-btn">

                    Delete Card

                </a>

            </div>


            <a
                href="{% url 'card_list' %}">

                ← Back to Cards

            </a>

        </div>

    </div>

</section>

{% endblock %}
